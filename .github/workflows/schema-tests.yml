name: Schema smoke tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SQLite schema tests
        run: python tests/test_schema.py
