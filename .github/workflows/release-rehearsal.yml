name: Release automation isolated rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cookie-catalog-release-rehearsal
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated test toolchain without release credentials
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Test release, recovery, machine authorization and synthetic bridge
        run: |
          node --test tools/tests/release-*.test.mjs
          cd app
          node --import tsx --test tests/release-machine.test.ts tests/release-maintenance.test.ts tests/release-kiss.test.ts tests/r1-release-bridge.test.ts tests/inline-workspace-interaction.test.ts
      - name: Compile accepted R1 overlay without deployment
        run: node tools/check-r1-release-bridge.mjs
